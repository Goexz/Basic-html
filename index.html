<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starbite.store/notify</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img src="https://play-lh.googleusercontent.com/7cIIPlWm4m7AGqVpEsIfyL-HW4cQla4ucXnfalMft1TMIYQIlf2vqgmthlZgbNAQoaQ" alt="Logo" width="30" height="30" class="d-inline-block align-text-top me-2">
                Starbite
            </a>
            <button class="navbar-toggler" type="button">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>
    </nav>

    <div class="container-fluid main-container">
        <div class="dashboard-card">
            <div class="row">
                <div class="col-md-4">
                    <div class="user-profile">
                        <div class="avatar-container">
                            <img src="https://tr.rbxcdn.com/30DAY-AvatarHeadshot-F3DA280353180AE3F4A2F91F65FFEFC8-Png/150/150/AvatarHeadshot/Webp/noFilter" alt="Avatar" class="avatar">
                        </div>
                        <div class="user-info">
                            <h4 id="username"></h4>
                            <div class="mode-badge">
                                <i id="game-name" class="bi bi-controller"></i>
                            </div>
                            <div class="progress-container">
                                <div class="progress-label">
                                    <span id="Hour1"></span>
                                    <span>/</span>
                                    <span id="Hour2"></span>
                                    <span id="farm-mode"></span>
                                </div>
                                <div class="progress">
                                    <div id="progress-bar" class="progress-bar" role="progressbar"></div>
                                </div>
                                <div id="progress-label" class="progress-percentage"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-8">
                    <div class="stats-container">
                        <div class="row w-100">
                            <div class="col-3">
                                <div class="stat-card">
                                    <div class="stat-icon pc-icon">
                                        <i class="bi bi-display"></i>
                                    </div>
                                    <div id="play-hour" class="stat-value"></div>
                                    <div class="stat-label">Hour</div>
                                </div>
                            </div>
                            <div class="col-3">
                                <div class="stat-card">
                                    <div class="stat-icon level-icon">
                                        <i class="bi bi-fire"></i>
                                    </div>
                                    <div id="level-player" class="stat-value"></div>
                                    <div class="stat-label">Level</div>
                                </div>
                            </div>
                            <div class="col-3">
                                <div class="stat-card">
                                    <div class="stat-icon battlepass-icon">
                                        <i class="bi bi-layers"></i>
                                    </div>
                                    <div id="unit-count" class="stat-value"></div>
                                    <div class="stat-label">Unit</div>
                                </div>
                            </div>
                            <div class="col-3">
                                <div class="stat-card">
                                    <div class="stat-icon item-icon">
                                        <i class="bi bi-box"></i>
                                    </div>
                                    <div id="status" class="stat-value"></div>
                                    <div sta class="stat-label">สถานะ<br><i class="bi bi-circle-fill premium-icon"></i></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="dashboard-card mt-4">
            <div class="match-info-header">
                <i class="bi bi-info-circle"></i> Match Information
            </div>
            <div class="match-summary">
                <div class="row">
                    <div class="col-md-8">
                        <div class="match-description">
                            <p id="info-more"></p>
                            <p id="info-more2"></p>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="match-stats">
                            <span><strong>จำนวนการฟาร์ม:</strong> <span class="farm-label" id="farm-count">125</span></span>
                            <span><strong>Map:</strong> <span id="map-chaper" class="stage-label">Z City - Chapter 9</span></span>
                            <span><strong>Turn:</strong> <span id="game-turn" class="wave-label">28</span></span>
                            <span><strong>Location:</strong> <span id="status-ingame" class="location-label">Offline</span></span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="match-results">
                <div class="table-responsive">
                    <table class="table table-dark table-hover">
                        <thead>
                            <tr>
                                <th>Result</th>
                                <th>Rewards</th>
                                <th>Map</th>
                                <th>Wave</th>
                                <th>Time</th>
                                <th>DateTime</th>
                            </tr>
                        </thead>
                        <tbody id="results-table">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
